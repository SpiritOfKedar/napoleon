server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: napoleon-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/napoleon}
    username: ${DB_USER:napoleon}
    password: ${DB_PASSWORD:napoleon}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate's validator doesn't understand the vector type.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    placeholders:
      embedding_dim: ${EMBEDDING_DIM:384}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_UPLOAD_SIZE:500MB}
      # Stream large uploads to disk instead of buffering them in memory.
      file-size-threshold: 1MB

napoleon:
  storage-dir: ${MEDIA_STORAGE_DIR:./data/media}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  transcription:
    base-url: ${TRANSCRIPTION_SERVICE_URL:http://localhost:8000}
    connect-timeout: ${TRANSCRIPTION_CONNECT_TIMEOUT:10s}
    # Transcribing an hour of audio on CPU can take a while.
    read-timeout: ${TRANSCRIPTION_READ_TIMEOUT:60m}
  embedding:
    model: ${EMBEDDING_MODEL:sentence-transformers/all-MiniLM-L6-v2}
    dim: ${EMBEDDING_DIM:384}
    batch-size: ${EMBED_BATCH_SIZE:32}
  chunking:
    window-sec: ${CHUNK_WINDOW_SEC:30}
    overlap-sec: ${CHUNK_OVERLAP_SEC:5}
  processing:
    worker-threads: ${PROCESSING_WORKER_THREADS:2}
  search:
    default-limit: ${SEARCH_DEFAULT_LIMIT:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
