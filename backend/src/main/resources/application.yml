server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: napoleon-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/napoleon}
    username: ${DB_USER:napoleon}
    password: ${DB_PASSWORD:napoleon}
    hikari:
      data-source-properties:
        # Lets the driver send JDBC batches as multi-row INSERTs (transcripts are bulk-inserted).
        reWriteBatchedInserts: true
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate's validator doesn't understand the vector type.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    placeholders:
      embedding_dim: ${EMBEDDING_DIM:384}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:5GB}
      max-request-size: ${MAX_UPLOAD_SIZE:5GB}
      # Stream large uploads to disk instead of buffering them in memory.
      file-size-threshold: 1MB

napoleon:
  storage-dir: ${MEDIA_STORAGE_DIR:./data/media}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  transcription:
    base-url: ${TRANSCRIPTION_SERVICE_URL:http://localhost:8000}
    connect-timeout: ${TRANSCRIPTION_CONNECT_TIMEOUT:10s}
    # Only for the upload-based fallback, which answers once the whole file is done.
    read-timeout: ${TRANSCRIPTION_READ_TIMEOUT:60m}
    # true when the transcription service mounts MEDIA_STORAGE_DIR (docker-compose does): files are
    # passed by path instead of uploaded, segments stream back with progress, and an interrupted
    # file resumes where it stopped.
    shared-storage: ${TRANSCRIPTION_SHARED_STORAGE:false}
    # The stream carries a heartbeat every ~15 s, so this only fires if the service is gone.
    stream-idle-timeout: ${TRANSCRIPTION_STREAM_IDLE_TIMEOUT:5m}
  embedding:
    model: ${EMBEDDING_MODEL:intfloat/multilingual-e5-small}
    dim: ${EMBEDDING_DIM:384}
    batch-size: ${EMBED_BATCH_SIZE:32}
  chunking:
    window-sec: ${CHUNK_WINDOW_SEC:30}
    overlap-sec: ${CHUNK_OVERLAP_SEC:5}
  processing:
    worker-threads: ${PROCESSING_WORKER_THREADS:2}
  search:
    default-limit: ${SEARCH_DEFAULT_LIMIT:10}
    # Candidates from vector + keyword retrieval that the cross-encoder re-scores. More = better
    # recall, slower queries (~15 ms per candidate on CPU).
    candidates: ${SEARCH_CANDIDATES:30}
    rerank: ${SEARCH_RERANK:true}
    # Reranked results scoring below this are not shown. Measured on real queries: relevant
    # passages 0.01-0.95, unrelated ones 0.000-0.006.
    min-score: ${SEARCH_MIN_SCORE:0.01}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
