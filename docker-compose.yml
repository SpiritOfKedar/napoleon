name: napoleon

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-napoleon}
      POSTGRES_USER: ${POSTGRES_USER:-napoleon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-napoleon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  transcription-service:
    build: ./transcription-service
    environment:
      WHISPER_BACKEND: ${WHISPER_BACKEND:-local}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_WHISPER_MODEL: ${OPENAI_WHISPER_MODEL:-whisper-1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      PRELOAD_MODELS: ${PRELOAD_MODELS:-true}
      WHISPER_CONCURRENCY: ${WHISPER_CONCURRENCY:-1}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      TRANSCRIBE_WINDOW_SEC: ${TRANSCRIBE_WINDOW_SEC:-1800}
      OPENAI_WINDOW_SEC: ${OPENAI_WINDOW_SEC:-1200}
      MEDIA_ROOT: /data/media
    ports:
      - "${TRANSCRIPTION_PORT:-8000}:8000"
    volumes:
      # Downloaded Whisper and sentence-transformers weights survive rebuilds.
      - model-cache:/models
      # Uploaded media, read-only: files are transcribed in place instead of re-uploaded over HTTP.
      - media-data:/data/media:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      # First start downloads the models.
      start_period: 600s

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-napoleon}
      DB_USER: ${POSTGRES_USER:-napoleon}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-napoleon}
      TRANSCRIPTION_SERVICE_URL: http://transcription-service:8000
      TRANSCRIPTION_READ_TIMEOUT: ${TRANSCRIPTION_READ_TIMEOUT:-60m}
      # The transcription service mounts media-data too (see above).
      TRANSCRIPTION_SHARED_STORAGE: "true"
      TRANSCRIPTION_STREAM_IDLE_TIMEOUT: ${TRANSCRIPTION_STREAM_IDLE_TIMEOUT:-5m}
      # Multipart temp files on the media volume, so storing an upload is a rename, not a copy.
      SPRING_SERVLET_MULTIPART_LOCATION: /data/media/.incoming
      MEDIA_STORAGE_DIR: /data/media
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5GB}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-32}
      CHUNK_WINDOW_SEC: ${CHUNK_WINDOW_SEC:-30}
      CHUNK_OVERLAP_SEC: ${CHUNK_OVERLAP_SEC:-5}
      PROCESSING_WORKER_THREADS: ${PROCESSING_WORKER_THREADS:-2}
      SEARCH_DEFAULT_LIMIT: ${SEARCH_DEFAULT_LIMIT:-10}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      transcription-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build: ./frontend
    environment:
      BACKEND_UPSTREAM: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  # One-shot: uploads the sample recording if it isn't in the library yet, then exits.
  seed:
    image: curlimages/curl:8.11.1
    environment:
      API_URL: http://backend:8080/api
      SAMPLE_FILE: /sample/sample-meeting.wav
      SEED_SAMPLE: ${SEED_SAMPLE:-true}
    volumes:
      - ./infra/scripts:/scripts:ro
      - ./infra/sample:/sample:ro
    entrypoint: ["sh", "/scripts/seed.sh"]
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  media-data:
  model-cache:
